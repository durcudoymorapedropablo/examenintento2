<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organitask - Editar tarea</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="task-page">
<div class="task-page-container">
    <div class="page-card">
        <div class="page-header">
            <div>
                <h1>Editar tarea</h1>
                <p class="page-subtitle">Modifica los datos de tu tarea.</p>
            </div>
            <a class="page-button secondary" href="{{ url_for('dashboard') }}">Volver al dashboard</a>
        </div>

        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% if mensajes %}
                <div class="messages">
                    {% for categoria, mensaje in mensajes %}
                        <div class="flash {{ categoria }}">{{ mensaje }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('editar_tarea', tarea_id=tarea['id']) }}" method="POST">
            <div class="form-group">
                <label for="nombre">Nombre de la tarea:</label>
                <input type="text" id="nombre" name="nombre" value="{{ form.get('nombre', tarea['nombre']) }}" required>
            </div>

            <div class="form-group">
                <label for="fecha_entrega">Fecha de entrega:</label>
                <input type="date" id="fecha_entrega" name="fecha_entrega" value="{{ form.get('fecha_entrega', tarea['fecha_entrega']) }}" min="{{ today }}" required>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion" name="descripcion" required>{{ form.get('descripcion', tarea['descripcion']) }}</textarea>
            </div>

            <div class="button-row">
                <button class="page-button primary" type="submit">Guardar cambios</button>
                <a class="page-button secondary" href="{{ url_for('dashboard') }}">Cancelar</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
